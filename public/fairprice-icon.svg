<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#0E7490"/>
    </linearGradient>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0891B2" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="100" height="100" rx="26" fill="url(#cyanGrad)"/>
  <!-- Decorative Leaf Accent -->
  <path d="M72 18 C80 18, 86 24, 84 32 C82 40, 74 42, 68 36 C66 30, 68 20, 72 18 Z" fill="url(#mintGrad)"/>
  <!-- Circular Card Badge -->
  <rect x="18" y="22" width="64" height="60" rx="18" fill="#FFFFFF" filter="url(#glow)"/>
  <!-- Dynamic Price Wave -->
  <path d="M26 56 Q36 44 46 54 T66 40 L74 46" stroke="#0891B2" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Upward Trend Dot -->
  <circle cx="74" cy="46" r="3.5" fill="#10B981"/>
  <!-- Rupee Symbol -->
  <text x="50" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#0E7490" text-anchor="middle">₹</text>
</svg>
