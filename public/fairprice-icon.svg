<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)"/>
  <!-- Decorative Leaf -->
  <path d="M50 20 C60 12, 72 16, 72 24 C72 32, 62 34, 50 32 Z" fill="url(#leafGrad)"/>
  <!-- Money Bag Body -->
  <path d="M50 35 C42 35 39 30 35 34 C31 38 38 45 36 50 C32 58 24 66 26 76 C28 85 40 88 50 88 C60 88 72 85 74 76 C76 66 68 58 64 50 C62 45 69 38 65 34 C61 30 58 35 50 35 Z" fill="#FFFFFF" filter="url(#shadow)"/>
  <!-- Bag Neck Tie -->
  <path d="M37 45 Q50 48 63 45" stroke="#F43F5E" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Rupee Symbol -->
  <text x="50" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#7C3AED" text-anchor="middle">₹</text>
</svg>
